<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1') return;
        // Solo sacar hosts de preview/Vercel u otros; no pelear con www ↔ apex.
        var isProd =
          host === 'controlmas.com.ar' ||
          host === 'www.controlmas.com.ar';
        if (isProd) return;
        location.replace(
          'https://controlmas.com.ar' + location.pathname + location.search + location.hash
        );
      })();
    </script>

    <!-- SEO primario -->
